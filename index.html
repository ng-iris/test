<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Crush</title>

    <link rel="stylesheet" href="style.css">

    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#141822;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    padding:20px;
}

.game-container{
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.top-bar{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
}

.score-box{
    padding:10px 20px;
    background:#252d44;
    border-radius:10px;
}

#resetBtn{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#ff9800;
    color:white;
    font-weight:bold;
}

#resetBtn:hover{
    background:#ffb74d;
}

.board{
    display:grid;
    grid-template-columns:repeat(8,70px);
    grid-template-rows:repeat(8,70px);
    gap:4px;
}

.candy{
    width:70px;
    height:70px;

    background:#252d44;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:36px;

    border-radius:15px;

    cursor:pointer;

    transition:
    transform .15s,
    box-shadow .15s;
}

.candy:hover{
    transform:scale(1.08);
    box-shadow:0 0 15px white;
}

.selected{
    outline:4px solid gold;
}

.striped{
    box-shadow:0 0 15px white;
}

.wrapped{
    box-shadow:0 0 15px orange;
}

.colorbomb{
    background:black;
    border:3px solid white;
}

@media(max-width:768px){

    .board{
        grid-template-columns:repeat(8,42px);
        grid-template-rows:repeat(8,42px);
    }

    .candy{
        width:42px;
        height:42px;
        font-size:24px;
    }
}
</style>
</head>
<body>

    <div class="game-container">

        <h1>🍭 Candy Crush</h1>

        <div class="top-bar">

            <div class="score-box">
                Score: <span id="score">0</span>
            </div>

            <button id="resetBtn">
                Reset Game
            </button>

        </div>

        <div id="board" class="board"></div>

    </div>

    <script>
        const width = 8;

const candyTypes = [
    "🔴",
    "🟠",
    "🟡",
    "🟢",
    "🔵",
    "🟣"
];

let board = [];
let score = 0;

let draggedIndex = null;
let replacedIndex = null;

class Candy{

    constructor(type){

        this.type = type;
        this.special = null;

    }

}

function randomCandy(){

    return new Candy(
        candyTypes[
            Math.floor(Math.random()*candyTypes.length)
        ]
    );

}

function updateScore(points){

    score += points;

    document.getElementById("score").textContent = score;

}

function createBoard(){

    board = [];

    for(let i=0;i<64;i++){

        let candy;

        do{

            candy = randomCandy();

            board.push(candy);

        }
        while(hasInitialMatch(i));

    }

    drawBoard();

}

function hasInitialMatch(index){

    const candy = board[index];

    if(!candy) return false;

    const row = Math.floor(index/width);
    const col = index%width;

    if(col>=2){

        const a=board[index-1];
        const b=board[index-2];

        if(a && b &&
            a.type===candy.type &&
            b.type===candy.type){

                board.pop();
                return true;
        }
    }

    if(row>=2){

        const a=board[index-width];
        const b=board[index-width*2];

        if(a && b &&
            a.type===candy.type &&
            b.type===candy.type){

                board.pop();
                return true;
        }
    }

    return false;
}

function drawBoard(){

    const boardEl=document.getElementById("board");

    boardEl.innerHTML="";

    board.forEach((candy,index)=>{

        const cell=document.createElement("div");

        cell.className="candy";

        if(candy){

            if(candy.special==="colorbomb"){

                cell.innerHTML="💣";
                cell.classList.add("colorbomb");

            }else{

                cell.innerHTML=candy.type;

            }

            if(candy.special==="striped")
                cell.classList.add("striped");

            if(candy.special==="wrapped")
                cell.classList.add("wrapped");

        }

        cell.draggable=true;

        cell.dataset.id=index;

        cell.addEventListener("dragstart",dragStart);
        cell.addEventListener("dragover",e=>e.preventDefault());
        cell.addEventListener("drop",dragDrop);

        cell.addEventListener("touchstart",touchStart,{passive:true});
        cell.addEventListener("touchend",touchEnd);

        boardEl.appendChild(cell);

    });

}

function dragStart(){

    draggedIndex=Number(this.dataset.id);

}

function dragDrop(){

    replacedIndex=Number(this.dataset.id);

    performMove();

}

function touchStart(){

    draggedIndex=Number(this.dataset.id);

}

function touchEnd(){

    const target=this.dataset.id;

    replacedIndex=Number(target);

    performMove();

}

function adjacent(a,b){

    return [
        a-1,
        a+1,
        a-width,
        a+width
    ].includes(b);

}

function swap(a,b){

    [board[a],board[b]]=[board[b],board[a]];

}

function performMove(){

    if(!adjacent(draggedIndex,replacedIndex))
        return;

    handleSpecialCombo(
        draggedIndex,
        replacedIndex
    );

    swap(
        draggedIndex,
        replacedIndex
    );

    let matches=findMatches();

    if(matches.length===0){

        swap(
            draggedIndex,
            replacedIndex
        );

        return;

    }

    resolveBoard();

}

function findMatches(){

    let matches=[];

    // horizontal

    for(let row=0;row<8;row++){

        let streak=1;

        for(let col=1;col<8;col++){

            let cur=row*8+col;
            let prev=cur-1;

            if(
                board[cur] &&
                board[prev] &&
                board[cur].type===board[prev].type
            ){
                streak++;
            }
            else{

                if(streak>=3){

                    matches.push({
                        start:cur-streak,
                        length:streak,
                        horizontal:true
                    });

                }

                streak=1;

            }

        }

        if(streak>=3){

            matches.push({
                start:row*8+8-streak,
                length:streak,
                horizontal:true
            });

        }

    }

    // vertical

    for(let col=0;col<8;col++){

        let streak=1;

        for(let row=1;row<8;row++){

            let cur=row*8+col;
            let prev=(row-1)*8+col;

            if(
                board[cur] &&
                board[prev] &&
                board[cur].type===board[prev].type
            ){
                streak++;
            }
            else{

                if(streak>=3){

                    matches.push({
                        start:cur-streak*8,
                        length:streak,
                        horizontal:false
                    });

                }

                streak=1;

            }

        }

    }

    return matches;

}

function createSpecial(match){
  
    if(match.length===4){

        board[match.start].special="striped";

    }

    if(match.length>=5){

        board[match.start].special="colorbomb";

    }

}

function removeMatches(matches){

    let remove = new Set();

    matches.forEach(match=>{

        let specialIndex = null;

        if(match.length === 4){

            specialIndex = replacedIndex;

            board[specialIndex].special = "striped";

        }
        else if(match.length >= 5){

            specialIndex = replacedIndex;

            board[specialIndex].special = "colorbomb";

        }

        for(let i=0;i<match.length;i++){

            let index;

            if(match.horizontal)
                index = match.start + i;
            else
                index = match.start + i * 8;

            // KEEP special candy alive
            if(index !== specialIndex){
                remove.add(index);
            }
        }
    });

    remove.forEach(index=>{

        board[index] = null;
        updateScore(10);

    });
}


function dropCandies(){

    for(let col=0;col<8;col++){

        for(let row=7;row>=0;row--){

            let index=row*8+col;

            if(board[index]==null){

                let above=row-1;

                while(above>=0){

                    let aboveIndex=
                    above*8+col;

                    if(board[aboveIndex]){

                        board[index]=board[aboveIndex];

                        board[aboveIndex]=null;

                        break;

                    }

                    above--;

                }

            }

        }

        for(let row=0;row<8;row++){

            let index=row*8+col;

            if(board[index]==null){

                board[index]=randomCandy();

            }

        }

    }

}

function resolveBoard(){

    let matches=findMatches();

    if(matches.length){

        removeMatches(matches);

        dropCandies();

        drawBoard();

        setTimeout(resolveBoard,200);

    }
    else{

        drawBoard();

    }

}

function handleSpecialCombo(a,b){

    const c1=board[a];
    const c2=board[b];

    if(!c1 || !c2) return;

    if(
        c1.special==="colorbomb" &&
        c2.special==="colorbomb"
    ){

        for(let i=0;i<64;i++)
            board[i]=null;

        dropCandies();

    }

    if(
        c1.special==="striped" &&
        c2.special==="striped"
    ){

        clearRowCol(a);
        clearRowCol(b);

    }

}

function clearRowCol(index){

    const row=Math.floor(index/8);
    const col=index%8;

    for(let i=0;i<8;i++){

        board[row*8+i]=null;
        board[i*8+col]=null;

    }

}

document
.getElementById("resetBtn")
.addEventListener("click",()=>{

    score=0;

    document.getElementById("score").textContent=0;

    createBoard();

});

createBoard();
    </script>

    <script src="script.js"></script>

</body>
</html>
