<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#121213;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.game{
    width:100%;
    max-width:500px;
    text-align:center;
}

h1{
    margin-bottom:20px;
    letter-spacing:2px;
}

.board{
    display:grid;
    gap:6px;
    margin-bottom:20px;
}

.row{
    display:flex;
    justify-content:center;
    gap:6px;
}

.tile{
    width:58px;
    height:58px;
    border:2px solid #3a3a3c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    text-transform:uppercase;
}

.correct{
    background:#538d4e;
    border-color:#538d4e;
}

.present{
    background:#b59f3b;
    border-color:#b59f3b;
}

.absent{
    background:#3a3a3c;
    border-color:#3a3a3c;
}

.keyboard{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.key-row{
    display:flex;
    justify-content:center;
    gap:6px;
}

.key{
    background:#818384;
    color:white;
    border:none;
    border-radius:4px;
    font-weight:bold;
    cursor:pointer;
    min-width:32px;
    height:50px;
    padding:0 10px;
    font-size:16px;
}

.key.large{
    min-width:65px;
    font-size:14px;
}

.key.correct{
    background:#538d4e;
}

.key.present{
    background:#b59f3b;
}

.key.absent{
    background:#3a3a3c;
}

#message{
    height:30px;
    margin-bottom:15px;
    font-size:20px;
    font-weight:bold;
}

.next-btn{
    margin:15px 0;
    padding:12px 24px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    background:#538d4e;
    color:white;
    cursor:pointer;
}

.next-btn:hover{
    opacity:0.9;
}

@media(max-width:480px){

    .tile{
        width:16vw;
        height:16vw;
        max-width:55px;
        max-height:55px;
        font-size:28px;
    }

    .key{
        flex:1;
        height:48px;
        padding:0;
        font-size:14px;
    }

    .key.large{
        flex:1.5;
    }
}
</style>
</head>
<body>

<div class="game">

    <h1>WORDLE</h1>

    <div id="message"></div>
    <a id="nextPageBtn" href="test.html" style="display:none;">
        <button class="next-btn">Continue</button>
    </a>

    <div id="board" class="board"></div>

    <div class="keyboard">

        <div class="key-row">
            <button class="key">Q</button>
            <button class="key">W</button>
            <button class="key">E</button>
            <button class="key">R</button>
            <button class="key">T</button>
            <button class="key">Y</button>
            <button class="key">U</button>
            <button class="key">I</button>
            <button class="key">O</button>
            <button class="key">P</button>
        </div>

        <div class="key-row">
            <button class="key">A</button>
            <button class="key">S</button>
            <button class="key">D</button>
            <button class="key">F</button>
            <button class="key">G</button>
            <button class="key">H</button>
            <button class="key">J</button>
            <button class="key">K</button>
            <button class="key">L</button>
        </div>

        <div class="key-row">
            <button class="key large" data-action="enter">ENTER</button>
            <button class="key">Z</button>
            <button class="key">X</button>
            <button class="key">C</button>
            <button class="key">V</button>
            <button class="key">B</button>
            <button class="key">N</button>
            <button class="key">M</button>
            <button class="key large" data-action="back">⌫</button>
        </div>

    </div>

</div>

<script>

const ANSWER = "HELLO";
const MAX_ROWS = 6;
const WORD_LENGTH = 5;

const board = document.getElementById("board");
const message = document.getElementById("message");

let row = 0;
let col = 0;

const guesses = Array(MAX_ROWS)
    .fill()
    .map(() => Array(WORD_LENGTH).fill(""));

for(let r=0;r<MAX_ROWS;r++){

    const rowDiv = document.createElement("div");
    rowDiv.className = "row";

    for(let c=0;c<WORD_LENGTH;c++){

        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = `r${r}c${c}`;

        rowDiv.appendChild(tile);
    }

    board.appendChild(rowDiv);
}

function updateTile(){
    for(let r=0;r<MAX_ROWS;r++){
        for(let c=0;c<WORD_LENGTH;c++){
            document.getElementById(`r${r}c${c}`).textContent =
                guesses[r][c];
        }
    }
}

function colorKey(letter,status){

    const keys=document.querySelectorAll(".key");

    keys.forEach(key=>{

        if(key.textContent===letter){

            if(status==="correct"){
                key.classList.remove("present","absent");
                key.classList.add("correct");
            }
            else if(status==="present" &&
                    !key.classList.contains("correct")){
                key.classList.add("present");
            }
            else if(status==="absent" &&
                    !key.classList.contains("correct") &&
                    !key.classList.contains("present")){
                key.classList.add("absent");
            }
        }
    });
}

function submitGuess(){

    if(col !== WORD_LENGTH) return;

    const guess = guesses[row].join("");

    for(let i=0;i<WORD_LENGTH;i++){

        const tile = document.getElementById(`r${row}c${i}`);

        if(guess[i] === ANSWER[i]){

            tile.classList.add("correct");
            colorKey(guess[i],"correct");
        }
        else if(ANSWER.includes(guess[i])){

            tile.classList.add("present");
            colorKey(guess[i],"present");
        }
        else{

            tile.classList.add("absent");
            colorKey(guess[i],"absent");
        }
    }

    if(guess === ANSWER){

    message.textContent = "🎉 You Win!";

    document.getElementById("nextPageBtn").style.display =
        "inline-block";

    row = MAX_ROWS;
    return;
}

    row++;
    col=0;

    if(row >= MAX_ROWS){
        message.textContent =
            `❌ Game Over - Answer: ${ANSWER}`;
    }
}

function handleInput(key){

    if(row >= MAX_ROWS) return;

    if(key === "ENTER"){
        submitGuess();
        return;
    }

    if(key === "BACKSPACE"){

        if(col>0){

            col--;
            guesses[row][col]="";
            updateTile();
        }
        return;
    }

    if(col < WORD_LENGTH){

        guesses[row][col] = key;
        col++;
        updateTile();
    }
}

document.addEventListener("keydown",(e)=>{

    if(/^[a-z]$/i.test(e.key)){
        handleInput(e.key.toUpperCase());
    }

    if(e.key==="Enter"){
        handleInput("ENTER");
    }

    if(e.key==="Backspace"){
        handleInput("BACKSPACE");
    }

});

document.querySelectorAll(".key").forEach(btn=>{

    btn.addEventListener("click",()=>{

        const action = btn.dataset.action;

        if(action==="enter"){
            handleInput("ENTER");
        }
        else if(action==="back"){
            handleInput("BACKSPACE");
        }
        else{
            handleInput(btn.textContent);
        }
    });

});

</script>

</body>
</html>
